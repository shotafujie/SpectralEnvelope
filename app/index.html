<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>包絡いじり</title>
<style>
  :root {
    --bg: #f4f2ee;
    --panel: #fffdf9;
    --ink: #1f1d1a;
    --muted: #6f6a62;
    --line: #d9d4ca;
    --accent: #c2410c;
    --accent-ink: #fff;
    --err-bg: #fdecea;
    --err-ink: #9b1c1c;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  input[type=range] { accent-color: rgb(120, 120, 120); }  /* 明るすぎると Chromium が未選択部分を黒く描く */
  input[type=range].changed { accent-color: var(--accent); }
  #tooltip {
    position: fixed;
    z-index: 10;
    max-width: 260px;
    padding: 6px 9px;
    background: #24211d;
    color: #f7f5f1;
    border-radius: 4px;
    font-size: 12px;
    line-height: 1.45;
    pointer-events: none;
    box-shadow: 0 2px 8px rgba(0, 0, 0, .18);
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 14px/1.5 -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
  }
  main {
    max-width: 1080px;
    margin: 0 auto;
    padding: 20px 16px 48px;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 300px;
    gap: 16px;
  }
  @media (max-width: 860px) { main { grid-template-columns: minmax(0, 1fr); } }
  header { grid-column: 1 / -1; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 18px; margin: 0; letter-spacing: .02em; }
  header p { margin: 0; color: var(--muted); font-size: 12px; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 14px; }
  h2 { font-size: 12px; font-weight: 600; color: var(--muted); margin: 0 0 10px; letter-spacing: .06em; }
  button {
    font: inherit;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--ink);
    border-radius: 4px;
    padding: 6px 12px;
    cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--ink); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  #rec { min-width: 96px; font-weight: 600; }
  #rec[data-state="recording"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  #elapsed, #meta { font-family: var(--mono); color: var(--muted); font-size: 12px; }
  #error { margin: 10px 0 0; padding: 8px 10px; background: var(--err-bg); color: var(--err-ink); border-radius: 4px; }
  #error:empty { display: none; }
  .graph-wrap { overflow-x: auto; }
  #graph { display: block; width: 100%; min-width: 520px; height: auto; }
  #graph .grid { stroke: #ebe7df; stroke-width: 1; }
  #graph .band-line { stroke: var(--accent); stroke-opacity: .25; stroke-width: 1; stroke-dasharray: 3 3; }
  #graph text { font: 10px var(--mono); fill: var(--muted); }
  #orig-line { fill: none; stroke: rgb(150, 150, 150); stroke-width: 1.25; }
  #partner-line { fill: none; stroke: rgb(37, 99, 235); stroke-width: 1.25; stroke-dasharray: 5 3; }
  #curve-zero { stroke: rgb(21, 128, 61); stroke-opacity: .25; stroke-width: 1; }
  #curve-line { fill: none; stroke: rgb(21, 128, 61); stroke-width: 1.5; stroke-opacity: .8; }
  .curve-point { fill: rgb(21, 128, 61); stroke: #fff; stroke-width: 1.5; cursor: ns-resize; touch-action: none; }
  .curve-point:hover, .curve-point.active { fill: rgb(22, 163, 74); }
  #curve-readout { font-family: var(--mono); font-size: 12px; color: rgb(21, 128, 61); }
  select { font: inherit; padding: 4px 6px; border: 1px solid var(--line); border-radius: 4px; background: #fff; min-width: 0; width: 100%; }
  .field { display: grid; grid-template-columns: 76px minmax(0, 1fr); align-items: center; gap: 8px; margin: 6px 0; font-size: 12px; }
  #mod-line { fill: none; stroke: rgb(194, 65, 12); stroke-width: 2.25; }
  .legend { display: flex; gap: 16px; font-size: 12px; color: var(--muted); margin-top: 6px; }
  .legend i { display: inline-block; width: 18px; height: 0; vertical-align: middle; margin-right: 6px; border-top: 2px solid; }
  .frame-row { margin-top: 10px; }
  .frame-row input { flex: 1; min-width: 160px; }
  #unvoiced { color: var(--err-ink); font-size: 12px; }
  .param { display: grid; grid-template-columns: 76px minmax(0, 1fr) 48px; align-items: center; gap: 8px; margin: 6px 0; }
  .param label { font-size: 12px; }
  .param output { font-family: var(--mono); font-size: 12px; text-align: right; }
  .param input { width: 100%; }
  .sub { font-size: 11px; color: var(--muted); margin: 12px 0 2px; }
  .presets { display: flex; flex-wrap: wrap; gap: 6px; }
  .presets button { padding: 4px 10px; font-size: 12px; }
  .play { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .play button { padding: 10px; font-weight: 600; }
  #play-mod { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  #play-mod[aria-busy="true"] { opacity: .7; cursor: progress; }
  .side { display: flex; flex-direction: column; gap: 16px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>包絡いじり</h1>
    <p>録音 → WORLD で分解 → sp だけ加工 → 元の fo・ap で再合成</p>
  </header>

  <div class="side" style="grid-column: 1">
    <section>
      <div class="row">
        <button id="rec" type="button" data-state="idle"
          data-tip="押すと録音を始め、もう一度押すと止めて分解する（10 秒で自動停止）">● 録音</button>
        <button id="open-file" type="button"
          data-tip="手元の音声ファイルを読み込んで、録音と同じように分解する">ファイルを開く</button>
        <input id="file" type="file" accept="audio/*,.wav" hidden>
        <span id="elapsed"></span>
        <span id="meta"></span>
      </div>
      <p id="error" role="alert"></p>
    </section>

    <section>
      <h2>スペクトル包絡</h2>
      <div class="graph-wrap">
        <svg id="graph" viewBox="0 0 800 380" role="img" aria-label="元の包絡と加工後の包絡"></svg>
      </div>
      <div class="legend"><span><i style="border-color: rgb(150,150,150)"></i>元の包絡</span><span><i style="border-color: rgb(194,65,12); border-top-width: 3px"></i>加工後</span><span><i style="border-color: rgb(37,99,235); border-top-style: dashed"></i>混ぜる相手</span><span><i style="border-color: rgb(21,128,61)"></i>ゲインカーブ</span><span id="curve-readout" hidden></span></div>
      <div class="row frame-row">
        <label for="frame">フレーム</label>
        <input id="frame" type="range" min="0" max="0" step="1" value="0" disabled
          data-tip="包絡を表示する時間位置。5ms 刻みのフレーム番号（無声＝fo が 0 のフレームもある）">
        <output id="frame-value">—</output>
        <span id="unvoiced" hidden>無声フレームです（fo = 0）</span>
      </div>
    </section>
  </div>

  <div class="side" style="grid-column: auto">
    <section>
      <h2>再生・比較</h2>
      <div class="play">
        <button id="play-orig" type="button" disabled
          data-tip="録音したままの音を先頭から再生する">元音</button>
        <button id="play-mod" type="button" disabled
          data-tip="今のパラメータで再合成した音を再生する。Space キーで元音と交互に再生できる">加工音</button>
      </div>
      <p id="player" hidden data-source="" data-playing="0"></p>
    </section>

    <section>
      <h2>録音の選択・モーフィング</h2>
      <div class="field"><label for="current">現在の録音</label>
        <select id="current" data-tip="加工と再生の対象になる録音。切り替えるとグラフとフレームもその録音のものになる"></select></div>
      <div class="field"><label for="partner">混ぜる相手</label>
        <select id="partner" data-tip="包絡を混ぜる相手の録音。「なし」のときは混ぜない"><option value="">なし</option></select></div>
      <div class="param">
        <label for="p-mix">mix</label>
        <input id="p-mix" name="mix" type="range" min="0" max="1" step="0.01" value="0"
          data-tip="相手の包絡をこの比率で混ぜる。fo（基本周波数）と ap は現在の録音のまま（ダブルクリックで初期値に戻る）">
        <output id="mix-value">0.00</output>
      </div>
    </section>

    <section>
      <h2>パラメータ</h2>
      <div id="params"></div>
      <div class="row" style="margin-top: 10px">
        <button id="reset" type="button"
          data-tip="すべてのパラメータとゲインカーブを初期値に戻す">すべてリセット</button>
      </div>
    </section>

    <section>
      <h2>プリセット</h2>
      <div class="presets" id="presets"></div>
    </section>
  </div>
</main>

<div id="tooltip" role="tooltip" hidden></div>

<script type="module" src="app.js"></script>
</body>
</html>
